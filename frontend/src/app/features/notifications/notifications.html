<main><header><div><p>Actividad</p><h1>Notificaciones</h1></div>@if(service.unread()){<button (click)="service.readAll().subscribe()">Marcar todas como leídas</button>}</header><section>@for(item of service.items();track item.id){<article [class.unread]="!item.read_at" (click)="open(item)" tabindex="0"><span>{{item.type==='delivery_assigned'?'🚚':item.type==='new_order'?'📦':'🔔'}}</span><div><h2>{{item.title}}</h2><p>{{item.message}}</p><small>{{item.created_at|date:'dd/MM/yyyy HH:mm'}}</small></div></article>}@empty{<p>No tienes notificaciones.</p>}</section></main>
