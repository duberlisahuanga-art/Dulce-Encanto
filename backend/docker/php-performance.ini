; Laravel runs through PHP's CLI server in this local Docker environment.
; The application code is immutable until the image is rebuilt, so timestamp
; checks can be disabled safely and PHP files stay compiled between requests.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
realpath_cache_size=4096K
realpath_cache_ttl=600
